name: CI/CD Docker Build

# Trigger the workflow on every push to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-box: ubuntu-latest
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your code onto GitHub's cloud runner machine
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Log into your Docker Hub account securely using secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets::DOCKERHUB_USERNAME }}
        password: ${{ secrets::DOCKERHUB_TOKEN }}

    # Step 3: Set up Docker Buildx (advanced caching and multi-platform tools)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 4: Build your Dockerfile and push the image to Docker Hub
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # Replace your-dockerhub-username with your actual username below
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/react-todo-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/react-todo-app:${{ github.sha }}

