apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-todo-deployment
  labels:
    app: react-todo
spec:
  replicas: 2 # Kubernetes will run 2 identical copies of your app for redundancy
  selector:
    matchLabels:
      app: react-todo
  template:
    metadata:
      labels:
        app: react-todo
    spec:
      containers:
      - name: react-todo-container
        image: zyzmann/react-todo-app:59fcca95ae7560977f20bfee86fd0b8f27377c5c # Updated automatically by GitHub Actions
        imagePullPolicy: Always
        ports:
        - containerPort: 80

