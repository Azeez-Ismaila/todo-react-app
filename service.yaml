apiVersion: v1
kind: Service
metadata:
  name: react-todo-service
spec:
  type: LoadBalancer # Exposes the service externally on your Mac
  selector:
    app: react-todo
  ports:
    - protocol: TCP
      port: 8080        # The port you will type in your browser (localhost:8080)
      targetPort: 80    # The internal port Nginx is listening on inside the container

